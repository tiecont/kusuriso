name: kusuriso

services:
  migrate:
    build: .
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["node", "dist/scripts/db.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  storage-init:
    build: .
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: ["node", "dist/scripts/storage.js"]
    depends_on:
      minio:
        condition: service_started

  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
    name: nodejs_postgres_data
  minio_data:
    name: nodejs_minio_data
